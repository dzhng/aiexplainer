[project]
name = "aiexplainer-training"
version = "0.0.0"
description = "Trains and exports the tiny models behind each chapter of the LLM explainer."
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3", "tokenizers==0.23.2", "torch==2.14.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "jsonschema==4.26.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
