# Chapter 13 drafter candidate: one layer of the full architecture, d=96.
id = "drafter-96"

[arch]
d_model = 96
n_layers = 1
n_heads = 2
n_kv_heads = 1
ctx = 256
attention = "causal"
positions = "rope"
mlp = { kind = "swiglu", hidden = 384 }
norm = "rmsnorm"
residual = true
tied_embeddings = true

[train]
seed = 0
steps = 4000
batch_size = 64
lr = 3e-3
