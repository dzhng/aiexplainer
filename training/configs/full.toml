# Chapters 8-13: 4 layers, 4 query heads sharing 2 key/value heads (GQA, D36).
id = "full"

[arch]
d_model = 128
n_layers = 4
n_heads = 4
n_kv_heads = 2
ctx = 256
attention = "causal"
positions = "rope"
mlp = { kind = "swiglu", hidden = 512 }
norm = "rmsnorm"
residual = true
tied_embeddings = true

[train]
seed = 0
steps = 8000
batch_size = 64
lr = 3e-3
