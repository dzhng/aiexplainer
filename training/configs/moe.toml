# Chapter 14: the full shape with 8 SwiGLU experts, top-2, and the Switch balance loss.
id = "moe"

[arch]
d_model = 128
n_layers = 4
n_heads = 4
n_kv_heads = 2
ctx = 256
attention = "causal"
positions = "rope"
mlp = { kind = "moe", experts = 8, top_k = 2, hidden = 128 }
norm = "rmsnorm"
residual = true
tied_embeddings = true

[train]
seed = 0
steps = 8000
batch_size = 64
lr = 3e-3
